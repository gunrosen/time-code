<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Time-code lớn để đồng bộ mốc thời gian giữa nhiều camera." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='7' y='2' width='2' height='12' fill='%23ffd400'/%3E%3C/svg%3E" />
    <title>Sync Timecode</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <header id="meta">
        <span id="date"></span>
        <span id="tz"></span>
        <span id="status"></span>
        <button id="change-task" type="button" data-no-hold>Đổi task</button>
        <button id="reset" type="button" data-no-hold hidden>↺ Session mới</button>
      </header>
      <div id="task">
        <span id="task-code">—</span>
        <span id="task-name">Chưa chọn task</span>
      </div>
      <div id="tag" data-state="IDLE">
        <div id="tag-progress"></div>
        <span id="tag-label">Giữ 1 giây để START</span>
      </div>
      <div id="time">--:--:--.-</div>
      <div class="cell" id="sweep-cell"><canvas id="sweep" aria-label="Thước mili-giây"></canvas></div>
      <div class="cell" id="strip-cell"><canvas id="strip" aria-label="Dải mã Gray"></canvas></div>
      <div class="cell" id="qr-cell"><canvas id="qr" aria-label="QR thời gian"></canvas></div>
    </main>
    <section id="picker" data-no-hold data-no-fullscreen hidden aria-label="Chọn task">
      <header id="picker-head">
        <h1 id="picker-title">Chọn task</h1>
        <input id="picker-search" type="search" placeholder="Tìm mã hoặc tên task…" autocomplete="off" />
        <button id="picker-close" class="picker-button" type="button" hidden>Đóng</button>
      </header>
      <div id="picker-list" class="picker-scroll"></div>
      <div id="picker-detail" hidden>
        <div id="picker-detail-head">
          <button id="picker-back" class="picker-button" type="button">← Danh sách</button>
          <div id="picker-detail-code"></div>
          <div id="picker-detail-name"></div>
          <button id="picker-select" type="button">Chọn task này</button>
        </div>
        <div id="picker-steps"></div>
      </div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
